<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Rechenweg</title>
<style>
  :root {
    --cream: #f3eee4;
    --paper: #fffdf8;
    --ink: #2c2825;
    --muted: #6a635b;
    --line: #e4d9c8;
    --teal: #1c6b66;
    --teal-dark: #145550;
    --wash: #e5f3f1;
    --soft: #d7ebe7;
    --shadow: 0 12px 32px rgba(44, 40, 37, 0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 10% -10%, rgba(28, 107, 102, 0.08), transparent 55%),
      var(--cream);
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
    font-size: 18px;
    line-height: 1.4;
    border-top: 7px solid var(--teal);
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus { outline: none; }
  button:focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 3px;
  }
  .app {
    width: min(520px, 100%);
    margin: 0 auto;
    padding: 22px 18px 36px;
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.1;
    letter-spacing: -0.03em;
    font-weight: 750;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 .mark {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--teal);
    display: inline-block;
    flex: none;
  }
  .goal-line {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 16px;
  }
  .head-btn {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    font-size: 15px;
    font-weight: 650;
  }
  .trail {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 16px;
  }
  .dots {
    position: relative;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    align-items: center;
  }
  .dots::before {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    top: 50%;
    height: 3px;
    background: #e3d8c8;
    transform: translateY(-50%);
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    justify-self: center;
    background: var(--paper);
    border: 2px solid #d9d0c2;
    position: relative;
    z-index: 1;
    transition: background 0.35s ease, border-color 0.35s ease;
  }
  .dot.on {
    background: var(--teal);
    border-color: var(--teal);
  }
  .goal-mark { width: 32px; height: 32px; flex: none; }
  .card {
    background: var(--paper);
    border-radius: 28px;
    border: 1px solid rgba(44, 40, 37, 0.06);
    box-shadow: var(--shadow);
    padding: 18px 16px 16px;
  }
  .aufgabe {
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.01em;
  }
  .pip-wrap { display: flex; justify-content: center; margin: 6px 0 2px; }
  .prompt {
    margin: 8px 0 0;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .expr {
    margin: 6px 0 12px;
    text-align: center;
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .expr.xl { font-size: clamp(64px, 16vw, 92px); }
  .expr.lg { font-size: clamp(48px, 12vw, 72px); }
  .expr.md { font-size: clamp(34px, 8.5vw, 52px); }
  .expr.sm { font-size: clamp(26px, 6.4vw, 40px); }
  .q { color: var(--teal); }
  .field {
    min-height: 72px;
    border-radius: 18px;
    border: 2px solid var(--line);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, Palatino, serif;
    font-size: 40px;
    letter-spacing: 0.03em;
  }
  .field.ok {
    border-color: var(--teal);
    background: var(--wash);
    color: var(--teal-dark);
  }
  .field.show {
    border-color: var(--teal);
    color: var(--teal-dark);
  }
  .caret {
    width: 2px;
    height: 34px;
    background: var(--teal);
    margin-left: 3px;
    border-radius: 1px;
    opacity: 0.7;
  }
  .msg {
    text-align: center;
    min-height: 2.7em;
    margin: 10px 0 6px;
    font-size: 18px;
    color: transparent;
  }
  .msg.soft { color: var(--ink); }
  .msg.ok { color: var(--teal-dark); font-weight: 750; }
  .hint {
    margin: 0 0 10px;
    padding: 12px 14px;
    background: var(--wash);
    border-radius: 16px;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.4;
  }
  .hint b { color: var(--teal-dark); }
  .help-btn { min-height: 48px; font-size: 18px; margin-bottom: 8px; }
  .stufe-quiet {
    margin: -2px 0 6px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .timebar {
    height: 12px;
    border-radius: 999px;
    background: #e7dfd2;
    overflow: hidden;
    margin: 2px 0 8px;
  }
  .timebar > span {
    display: block;
    height: 100%;
    background: var(--teal);
    border-radius: 999px;
  }
  .btn.stufe {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 78px;
    margin-top: 10px;
    line-height: 1.2;
  }
  .stufe-title { font-size: 20px; font-weight: 750; }
  .stufe-sub { font-size: 15px; font-weight: 600; }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 4px;
    user-select: none;
  }
  .pad button, .choices button, .btn {
    border-radius: 16px;
    border: 2px solid var(--line);
    background: #fff;
    min-height: 62px;
    font-size: 28px;
    font-weight: 650;
    transition: transform 0.08s ease, background 0.08s ease;
  }
  .pad button:active, .choices button:active, .btn:active { transform: scale(0.98); }
  .pad .ghost { font-size: 18px; color: var(--muted); font-weight: 700; }
  .pad .go, .btn {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
    font-size: 22px;
  }
  .pad .go:active, .btn:active { background: var(--teal-dark); }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 6px;
    user-select: none;
  }
  .choices button {
    min-height: 104px;
    font-family: Georgia, Palatino, serif;
    font-size: clamp(36px, 9vw, 48px);
    font-weight: 600;
  }
  .choices button.picked {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .art {
    position: relative;
    height: 262px;
    border-radius: 22px;
    overflow: hidden;
    background: var(--wash);
    user-select: none;
  }
  .caption {
    margin: 16px auto 14px;
    text-align: center;
    font-size: 20px;
    line-height: 1.35;
    max-width: 34ch;
  }
  .art-a .water {
    position: absolute;
    left: 0; right: 0; bottom: 48px;
    height: 74px;
    background: #c5e4df;
  }
  .art-a .bank {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 54px;
    background: #efe6d6;
  }
  .art-a .boat {
    position: absolute;
    left: 18px;
    bottom: 78px;
    transform: translateX(220px);
  }
  .art-a .snail {
    position: absolute;
    left: 18px;
    bottom: 10px;
    width: 130px;
    transform: translateX(54px);
  }
  .bubble {
    position: absolute;
    left: 4px;
    bottom: 72px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 5px 8px;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 26px;
    bottom: -9px;
    border-width: 8px 7px 0 7px;
    border-style: solid;
    border-color: var(--ink) transparent transparent transparent;
  }
  .art-a .watcher {
    position: absolute;
    right: 8px;
    bottom: 4px;
  }
  .art-b { background: linear-gradient(#f7f3ea, #f3eee4); }
  .art-b .pip-slot {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
  }
  .art-b .bird {
    position: absolute;
    top: 28px;
    left: 0;
    transform: translateX(430px);
  }
  .art-b .hat {
    position: absolute;
    width: 52px;
    left: calc(50% - 24px);
    top: 118px;
  }
  .art-c {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    padding: 28px 12px 18px;
    background: #f7f3ea;
  }
  .guys { display: flex; gap: 10px; align-items: flex-end; }
  .guy {
    width: 76px;
    height: 98px;
    border-radius: 40px;
    background: var(--paper);
    border: 3px solid var(--ink);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 16px;
    font-family: Georgia, Palatino, serif;
    font-size: 32px;
    position: relative;
    transform-origin: center bottom;
  }
  .guy::before {
    content: "";
    position: absolute;
    top: 24px;
    left: 20px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 26px 0 0 var(--ink);
  }
  .guy::after {
    content: "";
    position: absolute;
    top: 42px;
    width: 14px;
    height: 8px;
    border-radius: 0 0 10px 10px;
    border: 2px solid var(--ink);
    border-top: none;
    opacity: 0;
  }
  .land { position: relative; height: 230px; }
  .land svg.scene { width: 100%; height: 230px; display: block; }
  .land .stand {
    position: absolute;
    bottom: 18px;
    left: 36px;
  }
  .land.baum .stand { left: 28px; bottom: 22px; }
  .land.turm .stand { left: 42px; bottom: 28px; }
  .arrive {
    text-align: center;
    margin: 14px 0 6px;
    font-size: 18px;
  }
  .score-line {
    text-align: center;
    margin: 0 0 8px;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: -0.02em;
    font-weight: 750;
  }
  .score-line span { color: var(--teal-dark); }
  h2 {
    margin: 2px 0 8px;
    text-align: center;
    font-size: 28px;
    letter-spacing: -0.03em;
  }
  .reward { position: relative; }
  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .confetti i {
    position: absolute;
    top: 0;
    opacity: 0;
    animation-name: fall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
    animation-iteration-count: 1;
  }
  .sticker-wrap { display: flex; justify-content: center; margin: 6px 0 14px; }
  .sticker { text-align: center; }
  .sticker p { margin: 4px 0 0; color: var(--teal-dark); font-weight: 700; }
  .eyebrow {
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .btn { width: 100%; margin-top: 4px; }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .noscript {
    max-width: 520px;
    margin: 24px auto;
    padding: 0 18px;
  }
  .art-d { background: linear-gradient(#f7f3ea, #e7f4f2); }
  .art-d .star { position: absolute; left: calc(50% - 28px); top: 28px; }
  .art-d .pip-slot, .art-f .pip-slot {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
  }
  .art-e { background: #f7f3ea; }
  .art-e .apple { position: absolute; left: calc(50% - 46px); top: 64px; }
  .art-e .worm { position: absolute; left: calc(50% - 10px); top: 92px; }
  .art-e .pip-slot { position: absolute; right: 12px; bottom: 6px; }
  .art-f { background: linear-gradient(#e7f4f2, #f7f3ea); }
  .art-f .cloud { position: absolute; left: calc(50% - 46px); top: 16px; }
  .art-f .drops { position: absolute; left: calc(50% - 16px); top: 78px; width: 36px; height: 54px; }
  .drop {
    position: absolute; width: 4px; height: 12px; border-radius: 4px; background: #1c6b66; opacity: 0.55;
  }
  @media (prefers-reduced-motion: no-preference) {
    .art-a .boat { animation: boatMove 4s ease-in-out forwards; }
    .art-a .snail { animation: snailMove 4s ease-out forwards; }
    .art-b .bird { animation: flyBy 4s linear forwards; }
    .art-b .wing { transform-origin: 34px 28px; animation: flap 0.7s ease-in-out 3; }
    .art-b .hat { animation: hatDrop 4s ease-in forwards; }
    .guy { animation: stretch 4s ease-in-out forwards; animation-delay: var(--d); }
    .guy::after { animation: yawn 4s ease-in-out forwards; animation-delay: var(--d); }
    .art-d .star { animation: starUp 4s ease-in-out forwards; }
    .art-e .apple { animation: appleDrop 4s ease-in forwards; }
    .art-e .worm { animation: wormPeek 4s ease-out forwards; }
    .art-f .drops .drop { animation: drip 1.4s ease-in infinite; }
  }
  @keyframes boatMove {
    from { transform: translateX(-90px); }
    to { transform: translateX(220px); }
  }
  @keyframes snailMove {
    from { transform: translateX(0); }
    to { transform: translateX(54px); }
  }
  @keyframes flyBy {
    from { transform: translateX(-50px); }
    to { transform: translateX(430px); }
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
  @keyframes hatDrop {
    0% { left: 8%; top: 34px; transform: rotate(-12deg); }
    26% { left: 34%; top: 42px; transform: rotate(8deg); }
    52% { left: calc(50% - 24px); top: 96px; transform: rotate(14deg); }
    68%, 100% { left: calc(50% - 24px); top: 118px; transform: rotate(0deg); }
  }
  @keyframes stretch {
    0%, 100% { transform: scale(1, 1) translateY(0); }
    30% { transform: scale(0.94, 1.16) translateY(-12px); }
    48% { transform: scale(1.05, 0.9) translateY(5px); }
    70% { transform: scale(1, 1) translateY(0); }
  }
  @keyframes yawn {
    0%, 20% { opacity: 0; height: 4px; }
    32%, 44% { opacity: 1; height: 12px; }
    58%, 100% { opacity: 0; height: 6px; }
  }
  @keyframes starUp {
    0% { top: 150px; transform: rotate(-8deg); }
    70%, 100% { top: 22px; transform: rotate(8deg); }
  }
  @keyframes appleDrop {
    0% { top: -40px; }
    62% { top: 78px; }
    76% { top: 64px; }
    100% { top: 70px; }
  }
  @keyframes wormPeek {
    0%, 55% { opacity: 0; transform: translateY(8px); }
    80%, 100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes drip {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 0.7; }
    100% { transform: translateY(36px); opacity: 0; }
  }
  @keyframes fall {
    0% { opacity: 1; transform: translateY(0) rotate(var(--r)); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(460px) rotate(calc(var(--r) + 150deg)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti i { animation: none; opacity: 0; }
  }
  @media (max-width: 420px) {
    .art-c { gap: 8px; padding-left: 8px; padding-right: 8px; }
    .art-c .watcher .pip { width: 68px; height: 68px; }
    .guy { width: 62px; height: 84px; font-size: 26px; }
  }
  @media (max-width: 380px) {
    .app { padding-left: 12px; padding-right: 12px; }
    .choices button { min-height: 88px; }
    .pad button, .choices button, .btn { min-height: 58px; }
  }
  @media (max-width: 480px) {
    body.playing {
      min-height: 0;
      height: 100vh;
      height: 100svh;
      max-height: 100svh;
      overflow: hidden;
    }
    body.playing .app {
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding:
        max(4px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(4px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }
    body.playing header { flex: none; }
    body.playing h1 { font-size: 22px; }
    body.playing .goal-line { margin: 0; font-size: 13px; line-height: 1.2; }
    body.playing .head-btn { min-height: 36px; padding: 0 10px; font-size: 14px; }
    body.playing .trail { flex: none; margin: 4px 0 6px; gap: 6px; }
    body.playing .dot { width: 10px; height: 10px; }
    body.playing .goal-mark,
    body.playing .goal-mark svg { width: 22px; height: 22px; }
    body.playing main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    body.playing .card {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 10px 6px;
      border-radius: 18px;
    }
    body.playing .aufgabe { font-size: 13px; line-height: 1.2; }
    body.playing .stufe-quiet { margin: 0 0 2px; font-size: 12px; line-height: 1.2; }
    body.playing .timebar { height: 8px; margin: 1px 0 4px; }
    body.playing .pip-wrap { margin: 0; }
    body.playing .pip-wrap svg { width: 44px; height: 44px; }
    body.playing .prompt { margin: 2px 0 0; font-size: 16px; line-height: 1.2; }
    body.playing .expr { margin: 1px 0 4px; line-height: 1.05; }
    body.playing .expr.xl { font-size: 40px; }
    body.playing .expr.lg { font-size: 32px; }
    body.playing .expr.md { font-size: 24px; }
    body.playing .expr.sm { font-size: 18px; }
    body.playing .field {
      min-height: 40px;
      border-radius: 12px;
      font-size: 28px;
    }
    body.playing .caret { height: 24px; }
    body.playing .msg {
      min-height: 1.25em;
      margin: 3px 0;
      font-size: 14px;
      line-height: 1.25;
    }
    body.playing .hint {
      margin: 0 0 4px;
      padding: 6px 8px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.25;
    }
    body.playing .help-btn {
      min-height: 36px;
      margin-bottom: 4px;
      font-size: 16px;
    }
    body.playing .pad {
      flex: 1 1 auto;
      min-height: 0;
      margin-top: auto;
      align-content: end;
      gap: 6px;
      grid-template-rows: repeat(4, minmax(36px, 64px));
    }
    body.playing .pad button,
    body.playing .choices button,
    body.playing .btn {
      min-height: 0;
      border-radius: 12px;
    }
    body.playing .pad button {
      height: 100%;
      font-size: 22px;
      padding: 0;
    }
    body.playing .pad .ghost { font-size: 16px; }
    body.playing .pad .go { font-size: 18px; }
    body.playing .choices {
      flex: 1 1 auto;
      min-height: 0;
      margin-top: auto;
      align-content: end;
      gap: 8px;
      grid-template-rows: repeat(2, minmax(44px, 88px));
    }
    body.playing .choices button {
      height: 100%;
      min-height: 0;
      font-size: 32px;
    }
    body.playing .btn { min-height: 44px; }
  }
  @media (max-width: 480px) and (max-height: 700px) {
    body.playing h1 { font-size: 20px; }
    body.playing .pip-wrap svg { width: 36px; height: 36px; }
    body.playing .expr.xl { font-size: 34px; }
    body.playing .expr.lg { font-size: 28px; }
    body.playing .expr.md { font-size: 22px; }
    body.playing .expr.sm { font-size: 17px; }
    body.playing .field { min-height: 36px; font-size: 24px; }
    body.playing .prompt { font-size: 15px; }
    body.playing .pad { gap: 5px; grid-template-rows: repeat(4, minmax(32px, 52px)); }
    body.playing .hint { font-size: 13px; padding: 4px 8px; }
    body.playing .help-btn { min-height: 32px; font-size: 15px; }
  }
  .head-actions { display: flex; gap: 8px; align-items: flex-start; }
  .btn.quiet {
    background: var(--paper);
    color: var(--teal-dark);
    border: 2px solid var(--teal);
  }

  function ensureShape(bag) {

    var task = null;
    if (type === 1) task = makeAdd(d, false);
    else if (type === 2) task = makeAdd(d, true);
    else if (type === 3) task = makeSub(d, false);
    else if (type === 4) task = makeSub(d, true);
    else if (type === 5) task = makeMissingAdd(d);
    else if (type === 6) task = makeMissingSub(d);
    else if (type === 7) task = makeDoubleHalf(d);
    else if (type === 8) task = makeToTen(d);
    else if (type === 9) task = makeCompare(d);
    else if (type === 10) task = makePattern(d);
    return task || fallback(type);
  }

  function paintTrail() {
    var trail = document.getElementById('trail');
    if (!trail) return;
    if (state.phase === 'interlude' || state.phase === 'sheet' || state.phase === 'pick') {
      trail.hidden = true;
      return;
    }
    trail.hidden = false;
    if (trail.getAttribute('data-goal') !== String(state.goal)) {
      trail.setAttribute('data-goal', String(state.goal));
      trail.innerHTML = trailInner();
    }
    var dots = trail.querySelectorAll('.dot');
    var i;
    for (i = 0; i < dots.length; i++) {
      if (i < state.score) dots[i].className = 'dot on';
      else dots[i].className = 'dot';
    }
  }

  }

  function padHTML() {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'weg', '0', 'ok'];
    var html = '<div class="pad">';
    var i, k;
    for (i = 0; i < keys.length; i++) {
      k = keys[i];
      if (k === 'weg') html += '<button type="button" class="ghost" data-act="del" aria-label="Löschen">weg</button>';
      else if (k === 'ok') html += '<button type="button" class="go" data-act="ok" aria-label="Prüfen">fertig</button>';
      else html += '<button type="button" data-act="digit" data-n="' + k + '" aria-label="' + k + '">' + k + '</button>';
    }
    return html + '</div>';
  }

  function taskHTML() {
    var task = state.tasks[state.index];
    var mood = state.feedbackKind === 'ok' ? 'happy' : (state.revealed ? 'calm' : 'calm');
    if (state.revealed) mood = 'calm';
    var html = '<div class="card">';
    html += '<p class="aufgabe">Aufgabe ' + (state.index + 1) + ' von 10</p>';
    html += '<p class="stufe-quiet">Stufe ' + state.stufe + '</p>';
    if (state.stufe === 3) html += barHTML();
    var pipMood = state.feedbackKind === 'ok' ? 'happy' : (state.showHint ? 'up' : 'calm');
    html += '<div class="pip-wrap">' + pipSVG(pipMood, 84) + '</div>';
    html += '<p class="prompt">' + esc(task.prompt) + '</p>';
    if (!task.choices) {
      var shown = state.revealed ? task.expr : task.expr;
      html += '<p class="' + exprClass(shown) + '">' + esc(shown).replace('?', '<span class="q">?</span>') + '</p>';
      var fieldClass = 'field' + (state.feedbackKind === 'ok' ? ' ok' : '') + (state.revealed ? ' show' : '');
      html += '<div class="' + fieldClass + '" aria-hidden="true">' + fieldHTML() + '</div>';
    } else {
      html += '<div class="choices">';
      var c, cls;
      for (c = 0; c < task.choices.length; c++) {
        cls = 'choice';
        if (state.locked && !state.revealed && task.choices[c] === task.answer) cls += ' picked';
        html += '<button type="button" class="' + cls + '" data-act="choice" data-n="' + task.choices[c] + '">' + task.choices[c] + '</button>';
      }
      html += '</div>';
    }
    var msgClass = 'msg' + (state.feedback ? ' ' + state.feedbackKind : '');
    html += '<p class="' + msgClass + '">' + (state.feedback ? esc(state.feedback) : '&nbsp;') + '</p>';
    if (state.stufe === 1 && state.showHint && !state.revealed) {
      var tip = task.hint;
      var said = state.showHint >= 2 ? tip.step : tip.method;
      html += '<p class="hint"><b>Pip sagt: </b>' + esc(said) + '</p>';
    }
    if (state.stufe === 1 && !state.revealed && !state.locked && state.showHint < 2) {
      html += '<button type="button" class="btn quiet help-btn" data-act="help">' +
        (state.showHint ? 'Noch ein Tipp' : 'Pip hilft') + '</button>';
    }
    if (state.revealed) html += '<button type="button" class="btn" data-act="next">Weiter</button>';
    else if (!task.choices) html += padHTML();
    html += '</div>';
    return html;
  }

        g = stickerById(list[i]);
        cls = 'sheet-slot filled';
        if (mini && state.stickerAdded && i === list.length - 1) cls += ' fresh';
        html += '<div class="' + cls + '">' + stickerSVG(g.id) + '<p>' + esc(g.name) + '</p></div>';
      } else {
        html += '<div class="sheet-slot"><p class="frei">frei</p></div>';
      }
    }
    return html + '</div>';
  }

  function sheetHTML() {
    var list = readStickers();
    var html = '<div class="card sheet-print">';
    html += '<h2>Aufkleberblatt</h2>';
    html += '<p class="sheet-note">' + list.length + ' von 6. Sechs Aufkleber füllen eine A4-Seite.</p>';
    html += slotsHTML(false);
    if (list.length >= 6) {
      html += '<button type="button" class="btn no-print" data-act="print">Drucken</button>';
      html += '<button type="button" class="btn quiet no-print" data-act="newsheet">Neues Blatt</button>';
    }
    html += '<button type="button" class="btn quiet no-print" data-act="back">Zurück</button>';
    html += '</div>';
    return html;
  }

  function rewardHTML() {
    var g = GOALS[state.goal];
    var scene = g.id === 'wiese' ? picnicScene() : (g.id === 'baum' ? treeScene() : lightScene());
    return '<div class="card reward">' + confettiHTML() +
      '<h2>Angekommen.</h2>' +
      scene +
      '<p class="arrive">' + esc(g.arrive) + '</p>' +
      '<p class="score-line"><span>' + state.score + '</span> von 10 allein geschafft.</p>' +
      '<p class="stufe-quiet">Stufe ' + state.stufe + '</p>' +
      '<p class="eyebrow">Aufkleberblatt</p>' +
      slotsHTML(true) +
      '<p class="sheet-note">' + sheetLine() + '</p>' +
      '<button type="button" class="btn quiet" data-act="sheet">Aufkleberblatt</button>' +
      '<button type="button" class="btn" data-act="again">Noch eine Runde</button></div>';
  }

  function setLive(text) {
    if (text === lastLive) return;
    lastLive = text;
    var node = document.getElementById('live');
    if (node) node.textContent = text;
  }

  function render() {
    var goal = GOALS[state.goal];
    var line = document.getElementById('goalLine');
    if (line) line.textContent = goal.path;
    paintTrail();
    document.body.classList.toggle('playing', state.phase === 'task');
    var sheetBtn = document.getElementById('sheetBtn');
    if (sheetBtn) sheetBtn.textContent = 'Blatt ' + readStickers().length + '/6';
    var stage = document.getElementById('stage');
    if (!stage) return;
    if (state.phase === 'sheet') {
      stage.innerHTML = sheetHTML();
      setLive('Aufkleberblatt. ' + readStickers().length + ' von 6.');
      return;
    }
    if (state.phase === 'pick') {
      stage.innerHTML = pickHTML();
      setLive('Wähl eine Stufe. ' + goal.path);
      return;
    }
    if (state.phase === 'interlude') {
      stage.innerHTML = interludeHTML();
      setLive(BEAT_LINES[state.beat] || '');
      return;
    }
    if (state.phase === 'reward') {
      stage.innerHTML = rewardHTML();
      setLive(goal.arrive + ' ' + state.score + ' von 10 allein geschafft.');
      return;
    }
    stage.innerHTML = taskHTML();
    var task = state.tasks[state.index];
    if (state.feedback) {
      var heard = '';
      if (state.stufe === 1 && state.showHint && !state.revealed && task.hint) {
        heard = ' ' + (state.showHint >= 2 ? task.hint.step : task.hint.method);
      }
      setLive(state.feedback + heard);
    } else if (task.choices) {
      setLive('Aufgabe ' + (state.index + 1) + '. ' + task.prompt + ' ' + task.choices[0] + ' oder ' + task.choices[1]);
    } else {
      setLive('Aufgabe ' + (state.index + 1) + '. ' + task.prompt + ' ' + task.expr);
    }
  }

  function later(fn, ms) {
    window.clearTimeout(waitHandle);
    var id = ++waitId;
    waitHandle = window.setTimeout(function () {
      if (id === waitId) fn();
    }, ms);
  }

  function cancelWait() {
    waitId++;
    window.clearTimeout(waitHandle);
  }

  var clock = { raf: 0, start: 0, left: 0, total: 0, running: false };

  function barFraction() {
    if (!clock.total) return 1;
    var left = clock.left;
    if (clock.running) left = clock.left - (Date.now() - clock.start);
    if (left < 0) left = 0;
    if (left > clock.total) left = clock.total;
    return left / clock.total;
  }

  function paintBar() {
    var el = document.getElementById('timeFill');
    if (!el) return;
    el.style.width = (barFraction() * 100) + '%';
  }

  function barHTML() {
    return '<div class="timebar" aria-hidden="true"><span id="timeFill" style="width:' +
      (barFraction() * 100) + '%"></span></div>';
  }

  function stopClock() {
    clock.running = false;
    if (clock.raf) {
      window.cancelAnimationFrame(clock.raf);
      clock.raf = 0;
    }
  }

  function pauseClock() {
    if (clock.running) {
      var left = clock.left - (Date.now() - clock.start);
      clock.left = left > 0 ? left : 0;
    }
    stopClock();
  }

  function tickClock() {
    if (!clock.running) return;
    var left = clock.left - (Date.now() - clock.start);
    if (left <= 0) {
      clock.left = 0;
      clock.running = false;
      clock.raf = 0;
      paintBar();
      timeUp();
      return;
    }
    paintBar();
    clock.raf = window.requestAnimationFrame(tickClock);
  }

  function armClock(ms) {
    stopClock();
    clock.total = ms;
    clock.left = ms;
    clock.start = Date.now();
    clock.running = true;
    clock.raf = window.requestAnimationFrame(tickClock);
  }

  function resumeClock() {
    if (state.stufe !== 3) return;
    if (state.phase !== 'task' || state.locked || state.revealed) return;
    if (!clock.total || clock.left <= 0) return;
    clock.start = Date.now();
    clock.running = true;
    if (clock.raf) window.cancelAnimationFrame(clock.raf);
    clock.raf = window.requestAnimationFrame(tickClock);
  }

  function timeUp() {
    if (state.stufe !== 3 || state.phase !== 'task' || state.locked || state.revealed) return;
    var task = state.tasks[state.index];
    revealGently('Die Zeit ist um. Die Antwort ist ' + task.answer + '. Schon gut.');
  }

  function revealGently(message) {
    pauseClock();
    state.locked = true;
    state.revealed = true;
    state.showHint = 0;
    state.feedback = message;
    state.feedbackKind = 'soft';
    render();
    later(advance, 2600);
  }

  function pickHTML() {
    var g = GOALS[state.goal];
    return '<div class="card pick-card">' +
      '<div class="pip-wrap">' + pipSVG('happy', 96) + '</div>' +
      '<h2>Wähl eine Stufe.</h2>' +
      '<p class="sheet-note">' + esc(g.path) + '. Zehn Aufgaben.</p>' +
      '<button type="button" class="btn quiet stufe" data-act="stufe" data-n="1">' +
        '<span class="stufe-title">Stufe 1 — mit Tipps</span>' +
        '<span class="stufe-sub">Pip hilft dir.</span></button>' +
      '<button type="button" class="btn quiet stufe" data-act="stufe" data-n="2">' +
        '<span class="stufe-title">Stufe 2 — ohne Tipps</span>' +
        '<span class="stufe-sub">Du rechnest allein.</span></button>' +
      '<button type="button" class="btn quiet stufe" data-act="stufe" data-n="3">' +
        '<span class="stufe-title">Stufe 3 — mit der Zeit</span>' +
        '<span class="stufe-sub">Ein Balken zeigt die Zeit.</span></button>' +
      '</div>';
  }

  function showPick() {
    cancelWait();
    stopClock();
    state.goal = state.pendingGoal;
    state.phase = 'pick';
    state.score = 0;
    state.locked = false;
    render();
  }

  function beginTask() {
    state.phase = 'task';
    state.tries = 0;
    state.entry = '';
    state.locked = false;
    state.showHint = 0;
    state.revealed = false;
    state.feedback = '';
    state.feedbackKind = '';
    state.timeMs = 0;
    if (state.stufe === 3) {
      state.timeMs = timeMsForType(state.tasks[state.index].type);
      armClock(state.timeMs);
    } else {
      stopClock();
    }
  }

  function showInterlude(beat) {
    stopClock();
    state.phase = 'interlude';
    state.beat = beat;
    state.locked = true;
    render();
    later(function () {
      if (state.phase !== 'interlude') return;
      beginTask();
      render();
    }, 4000);
  }

  function writeStoredGoal(n) {
    try { localStorage.setItem(STORAGE_KEY, String(n)); } catch (e) {}
  }

  function goalById(id) {
    var i;
    for (i = 0; i < GOALS.length; i++) if (GOALS[i].id === id) return GOALS[i];
    return GOALS[0];
  }

  function stickerById(id) {
    var i;
    for (i = 0; i < STICKERS.length; i++) if (STICKERS[i].id === id) return STICKERS[i];
    return null;
  }

  function readStoredStickers() {
    try {
      var raw = localStorage.getItem(STICKER_KEY);
      if (!raw) return [];
      var list = JSON.parse(raw);
      if (!list || !list.length) return [];
      var out = [];
      var i;
      for (i = 0; i < list.length && out.length < 6; i++) {
        if (stickerById(list[i])) out.push(list[i]);
      }
      return out;
    } catch (e) { return []; }
  }

  function loadAlbum() {
    album = readStoredStickers();
  }

  function readStickers() {
    return album.slice(0, 6);
  }

  function writeStickers(list) {
    album = list.slice(0, 6);
    try { localStorage.setItem(STICKER_KEY, JSON.stringify(album)); } catch (e) {}
  }

  function addCurrentSticker() {
    var list = readStickers();
    var missing = [];
    var i;
    if (list.length >= 6) return false;
    for (i = 0; i < STICKERS.length; i++) {
      if (list.indexOf(STICKERS[i].id) === -1) missing.push(STICKERS[i].id);
    }
    if (!missing.length) return false;
    list.push(missing[randInt(0, missing.length - 1)]);
    writeStickers(list);
    return true;
  }

  function showReward() {
    stopClock();
    state.phase = 'reward';
    state.locked = true;
    writeStoredGoal(state.goal);
    state.stickerAdded = addCurrentSticker();
    render();
  }

  function openSheet() {
    if (state.phase !== 'sheet') state.returnPhase = state.phase;
    if (state.phase === 'task' && state.stufe === 3) pauseClock();
    state.phase = 'sheet';
    render();
  }

  function closeSheet() {
    state.phase = state.returnPhase || 'task';
    render();
    if (state.phase === 'task' && state.stufe === 3) resumeClock();
  }

  function advance() {
    var done = state.index + 1;
    if (done >= 10) {
      showReward();
      return;
    }
    state.index = done;
    if (done === 3) {
      showInterlude(state.beats[0]);
      return;
    }
    if (done === 7) {
      showInterlude(state.beats[1]);
      return;
    }
    beginTask();
    render();
  }

  function submitValue(value) {
    if (state.locked || state.phase !== 'task') return;
    var task = state.tasks[state.index];
    if (value === null || !isFinite(value)) {
      state.feedback = 'Schreib erst eine Zahl.';
      state.feedbackKind = 'soft';
      render();
      return;
    }
    if (value === task.answer) {
      pauseClock();
      state.locked = true;
      state.score += 1;
      state.feedback = 'Ja. Das stimmt.';
      state.feedbackKind = 'ok';
      state.entry = String(value);
      state.showHint = 0;
      render();
      later(advance, 900);
      return;
    }
    state.tries += 1;
    state.entry = '';
    if (state.tries >= 3) {
      revealGently('Die Antwort ist ' + task.answer + '. Schon gut.');
      return;
    }
    state.feedback = 'Fast. Versuch\'s nochmal.';
    state.feedbackKind = 'soft';
    if (state.stufe === 1 && state.tries >= 2 && state.showHint < 1) state.showHint = 1;
    render();
  }

  function pushDigit(d) {
    if (state.locked || state.phase !== 'task') return;
    var task = state.tasks[state.index];
    if (!task || task.choices) return;
    if (state.entry === '0') state.entry = String(d);
    else if (state.entry.length < 3) state.entry += String(d);
    render();
  }

  function popDigit() {
    if (state.locked || state.phase !== 'task') return;
    if (state.tasks[state.index].choices) return;
    state.entry = state.entry.slice(0, -1);
    render();
  }

  function currentNumber() {
    if (state.entry === '') return null;
    var n = parseInt(state.entry, 10);
    if (!isFinite(n)) return null;
    return n;
  }

  function skipInterlude() {
    if (state.phase !== 'interlude') return;
    cancelWait();
    beginTask();
    render();
  }

  function continueAfterReveal() {
    if (state.phase !== 'task' || !state.revealed) return;
    cancelWait();
    advance();
  }

  function readStoredGoal() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      if (v === null) return null;
      var n = parseInt(v, 10);
      if (n === 0 || n === 1 || n === 2) return n;
    } catch (e) {}
    return null;
  }

  function initialGoal() {
    var last = readStoredGoal();
    if (last === null) return 0;
    return (last + 1) % 3;
  }

  function startRound(goal) {
    cancelWait();
    state.goal = goal;
    var types = planTypes();
    var tasks = [];
    var i;
    for (i = 0; i < types.length; i++) tasks.push(makeTask(types[i], i));
    state.tasks = tasks;
    state.index = 0;
    state.score = 0;
    state.beats = takeTwoBeats();
    state.stickerAdded = false;
    beginTask();
    var trail = document.getElementById('trail');
    if (trail) trail.setAttribute('data-goal', '');
    render();
  }

  function onClick(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'digit') { pushDigit(btn.getAttribute('data-n')); return; }
    if (act === 'del') { popDigit(); return; }
    if (act === 'ok') { submitValue(currentNumber()); return; }
    if (act === 'choice') { submitValue(parseInt(btn.getAttribute('data-n'), 10)); return; }
    if (act === 'skip') { skipInterlude(); return; }
    if (act === 'next') { continueAfterReveal(); return; }
    if (act === 'help') {
      if (state.stufe !== 1) return;
      if (state.phase !== 'task' || state.revealed || state.locked) return;
      if (state.showHint < 2) state.showHint += 1;
      render();
      return;
    }
    if (act === 'stufe') {
      if (state.phase !== 'pick') return;
      var picked = parseInt(btn.getAttribute('data-n'), 10);
      if (picked !== 1 && picked !== 2 && picked !== 3) return;
      state.stufe = picked;
      startRound(state.pendingGoal);
      return;
    }
    if (act === 'again') {
      state.pendingGoal = (state.goal + 1) % 3;
      showPick();
      return;
    }
    if (act === 'sheet') { openSheet(); return; }
    if (act === 'back') { closeSheet(); return; }
    if (act === 'print') { window.print(); return; }
    if (act === 'newsheet') { writeStickers([]); render(); return; }
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.phase === 'interlude') {
      if (e.key === 'Enter') { e.preventDefault(); skipInterlude(); }
      return;
    }
    if (state.phase !== 'task') return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (state.revealed) continueAfterReveal();
      else submitValue(currentNumber());
      return;
    }
    if (state.locked) return;
    var task = state.tasks[state.index];
    if (!task || task.choices) return;
    if (e.repeat) return;
    if (e.key >= '0' && e.key <= '9') {
      e.preventDefault();
      pushDigit(e.key);
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      popDigit();
    }
  }

  function boot() {
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    loadAlbum();
    beatDeck = shuffle([0, 1, 2, 3, 4, 5]);
    state.pendingGoal = initialGoal();
    showPick();
  }

  globalThis.__rechenTest = {
    planTypes: planTypes,
    makeTask: makeTask,
    hasNum: hasNum,
    fallback: fallback,
    timeMsForType: timeMsForType
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
</script>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  var proto = location.protocol;
  var host = location.hostname;
  var onLocal = host === 'localhost' || host === '127.0.0.1';
  if (proto === 'https:' || (proto === 'http:' && onLocal)) {
    navigator.serviceWorker.register('./sw.js');
  }
})();
</script>
</body>
</html>
